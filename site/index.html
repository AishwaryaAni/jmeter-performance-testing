<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Performance Results</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --ink: #14181f; --muted: #5b6573; --line: #e3e6ea;
      --pass: #1a7f4b; --pass-bg: #e6f5ec; --fail: #b42318; --fail-bg: #fdecea; --accent: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1216; --card: #171b21; --ink: #e8ebef; --muted: #9aa4b2; --line: #2a3038;
              --pass: #4ade80; --pass-bg: #12301f; --fail: #f87171; --fail-bg: #3a1716; --accent: #fb923c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 980px; margin: 0 auto; padding: 40px 16px 64px; }
    h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; }
    .sub { color: var(--muted); margin: 0 0 28px; }
    .sub a { color: var(--accent); }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .head h2 { margin: 0; font-size: 18px; text-transform: capitalize; }
    .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
    .badge.pass { color: var(--pass); background: var(--pass-bg); }
    .badge.fail { color: var(--fail); background: var(--fail-bg); }
    .badge.none { color: var(--muted); border: 1px solid var(--line); }
    .desc { color: var(--muted); font-size: 13px; margin: 0 0 14px; min-height: 40px; }
    dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 0 0 16px; }
    dt { font-size: 12px; color: var(--muted); }
    dd { margin: 0; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .btn { display: inline-block; text-decoration: none; color: var(--accent); font-weight: 600; }
    .breach { color: var(--fail); font-size: 13px; margin: 0 0 12px; padding-left: 18px; }
    footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>Booking API — Performance Results</h1>
  <p class="sub">Apache JMeter runs against a Dockerised booking API inside GitHub Actions.
    Each card links to the full JMeter HTML dashboard.
    <a href="https://github.com/AishwaryaAni/jmeter-performance-testing">Source &amp; methodology →</a></p>
  <div class="grid" id="cards"></div>
  <footer id="footer">Loading latest results…</footer>
</main>
<script>
  const profiles = [
    { id: "smoke",  desc: "2 customers + 1 visitor, 30 s — does everything work under minimal load?" },
    { id: "load",   desc: "20 customers + 10 visitors, 2 min — expected peak traffic, steady state." },
    { id: "stress", desc: "60 customers + 30 visitors, 4 min — ~3× peak, where does it degrade?" }
  ];
  const fmt = (n, d = 0) => (typeof n === "number" ? n.toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d }) : "–");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function load() {
    const cards = document.getElementById("cards");
    let latest = null;
    for (const p of profiles) {
      let s = null;
      try {
        const r = await fetch(`${p.id}/summary.json`, { cache: "no-store" });
        if (r.ok) s = await r.json();
      } catch (e) { /* profile not run yet */ }
      if (s && (!latest || s.generatedAt > latest)) latest = s.generatedAt;
      const badge = !s ? '<span class="badge none">not run yet</span>'
        : s.passed ? '<span class="badge pass">SLA passed</span>' : '<span class="badge fail">SLA breached</span>';
      const body = !s ? "" : `
        <dl>
          <dt>Requests</dt><dt>Error rate</dt>
          <dd>${fmt(s.samples)}</dd><dd>${fmt(s.errorPct, 2)}%</dd>
          <dt>p95 latency</dt><dt>Throughput</dt>
          <dd>${fmt(s.p95Ms)} ms</dd><dd>${fmt(s.throughput, 1)}/s</dd>
        </dl>
        ${s.breaches && s.breaches.length ? `<ul class="breach">${s.breaches.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
        <a class="btn" href="${p.id}/dashboard/index.html">Open JMeter dashboard →</a>`;
      cards.insertAdjacentHTML("beforeend", `
        <section class="card">
          <div class="head"><h2>${p.id}</h2>${badge}</div>
          <p class="desc">${p.desc}</p>${body}
        </section>`);
    }
    document.getElementById("footer").textContent =
      latest ? `Last run: ${new Date(latest).toLocaleString()}` : "No results published yet.";
  }
  load();
</script>
</body>
</html>
