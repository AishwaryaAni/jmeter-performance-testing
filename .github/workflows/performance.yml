name: Performance Tests

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 5 * * *"    # nightly 10:30 IST — includes the stress profile
  workflow_dispatch:
    inputs:
      profile:
        description: "Load profile"
        required: true
        default: "load"
        type: choice
        options: [ smoke, load, stress ]

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

env:
  JMETER_VERSION: "5.6.3"

jobs:
  perf:
    name: ${{ matrix.profile }} profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # push → smoke + load · nightly → smoke + load + stress · manual → chosen profile
      matrix:
        profile: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.profile) || (github.event_name == 'schedule' && '["smoke","load","stress"]' || '["smoke","load"]')) }}

    # System under test runs in a throwaway container on the runner — no load is sent to any public site
    services:
      booking-api:
        image: mwinteringham/restfulbooker:latest
        ports:
          - 3001:3001

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache JMeter
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: ~/apache-jmeter-${{ env.JMETER_VERSION }}
          key: jmeter-${{ env.JMETER_VERSION }}

      - name: Install JMeter ${{ env.JMETER_VERSION }}
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        # Fast CDN first; the (rate-limited) Apache archive only as a fallback for older versions
        run: |
          f="apache-jmeter-${JMETER_VERSION}.tgz"
          curl -fsSL --retry 3 "https://dlcdn.apache.org/jmeter/binaries/$f" -o /tmp/jmeter.tgz \
            || curl -fsSL --retry 3 "https://archive.apache.org/dist/jmeter/binaries/$f" -o /tmp/jmeter.tgz
          tar -xzf /tmp/jmeter.tgz -C ~

      - name: Wait for the booking API container
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/ping || true)
            if [ "$code" = "201" ]; then echo "API ready"; exit 0; fi
            sleep 2
          done
          echo "API did not become ready"; docker ps -a; docker logs "$(docker ps -aq | head -1)" || true; exit 1

      - name: Run JMeter (${{ matrix.profile }})
        run: |
          mkdir -p results
          ~/apache-jmeter-${JMETER_VERSION}/bin/jmeter -n \
            -t test-plans/booking-api-load-test.jmx \
            -q profiles/${{ matrix.profile }}.properties \
            -Jhost=localhost -Jport=3001 \
            -l results/results.jtl \
            -j results/jmeter.log \
            -e -o results/dashboard

      - name: SLA quality gate
        id: gate
        continue-on-error: true
        run: |
          node scripts/check-thresholds.js \
            results/dashboard/statistics.json \
            thresholds/${{ matrix.profile }}.json \
            ${{ matrix.profile }} \
            results/summary.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.profile }}
          path: |
            results/dashboard
            results/summary.json
            results/results.jtl
            results/jmeter.log
          retention-days: 14

      - name: Fail the job if an SLA was breached
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::Performance SLA breached for the ${{ matrix.profile }} profile — see the dashboard."
          exit 1

  site:
    name: Build results site
    needs: perf
    if: always() && needs.perf.result != 'cancelled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all profile results
        uses: actions/download-artifact@v4
        with:
          pattern: perf-*
          path: artifacts

      - name: Assemble site
        run: |
          mkdir -p public
          cp site/index.html public/
          for dir in artifacts/perf-*; do
            [ -d "$dir" ] || continue
            profile="${dir#artifacts/perf-}"
            mkdir -p "public/${profile}"
            [ -d "$dir/dashboard" ] && cp -r "$dir/dashboard" "public/${profile}/dashboard"
            [ -f "$dir/summary.json" ] && cp "$dir/summary.json" "public/${profile}/summary.json"
          done
          find public -maxdepth 2 | sort

      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publish:
    needs: site
    if: always() && needs.site.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
